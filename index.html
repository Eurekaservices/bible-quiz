/* =========================
   QUIZ VARIABLES
========================= */

let quiz = [];
let i = 0;
let score = 0;
let answered = false;
let player = "";


/* =========================
   START QUIZ
========================= */

function startQuiz(){

    player = document.getElementById("name").value.trim();

    if(!player){
        alert("Please enter your name.");
        return;
    }

    /*
    Questions are intentionally NOT randomized.
    They will appear in the exact order
    defined in the questions array.
    */

    quiz = [...questions];

    i = 0;
    score = 0;

    document.getElementById("start").classList.add("hidden");

    document.getElementById("quiz").classList.remove("hidden");

    document.getElementById("who").textContent =
        "Participant: " + player;

    render();
}


/* =========================
   RENDER QUESTION
========================= */

function render(){

    answered = false;

    document
        .getElementById("next")
        .classList
        .add("hidden");

    const q = quiz[i];

    document.getElementById("count").textContent =
        `Question ${i + 1} of ${quiz.length}`;

    document.getElementById("bar").style.width =
        `${((i) / quiz.length) * 100}%`;

    const optionsHTML = q.options.map((option, index) => {

        return `
        <button
            class="option"
            data-correct="${index === q.correct}"
            onclick="answer(this)"
        >
            ${"ABCD"[index]}. ${option}
        </button>
        `;

    }).join("");

    document.getElementById("questionCard").innerHTML = `

        <div class="category">
            ${q.category}
        </div>

        <h2>${q.question}</h2>

        ${optionsHTML}

        <div
            id="feedback"
            class="feedback explain"
        ></div>

    `;
}


/* =========================
   ANSWER QUESTION
========================= */

function answer(btn){

    if(answered){
        return;
    }

    answered = true;

    const correct =
        btn.dataset.correct === "true";

    const buttons =
        [...document.querySelectorAll(".option")];

    buttons.forEach(button => {

        button.disabled = true;

        if(button.dataset.correct === "true"){
            button.classList.add("correct");
        }

    });


    const feedback =
        document.getElementById("feedback");


    if(correct){

        score++;

        feedback.textContent =
            "✓ Correct!";

    }else{

        btn.classList.add("wrong");

        const correctButton =
            buttons.find(
                button =>
                button.dataset.correct === "true"
            );

        feedback.textContent =
            "✗ Not quite. Correct answer: " +
            correctButton.textContent;

    }


    feedback.classList.add("show");

    const nextButton =
        document.getElementById("next");

    nextButton.classList.remove("hidden");


    /*
    Change the button text on the final question.
    */

    if(i === quiz.length - 1){

        nextButton.textContent =
            "View Final Score";

    }else{

        nextButton.textContent =
            "Next Question";

    }

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

    i++;

    if(i < quiz.length){

        render();

    }else{

        finish();

    }

}


/* =========================
   FINISH QUIZ
========================= */

function finish(){

    document
        .getElementById("quiz")
        .classList
        .add("hidden");


    const percentage =
        Math.round(
            (score / quiz.length) * 100
        );


    let message = "";

    if(percentage >= 90){

        message =
            "Outstanding Bible knowledge!";

    }else if(percentage >= 80){

        message =
            "Excellent performance!";

    }else if(percentage >= 70){

        message =
            "Very good Bible knowledge!";

    }else if(percentage >= 60){

        message =
            "Good effort! Keep studying the Word.";

    }else if(percentage >= 50){

        message =
            "Fair performance. More Bible study will help.";

    }else{

        message =
            "Keep studying and try again!";

    }


    const result =
        document.getElementById("result");


    result.classList.remove("hidden");


    result.innerHTML = `

        <h1>Quiz Complete</h1>

        <p>
            <strong>${player}</strong>
        </p>

        <div class="score">
            ${score}/${quiz.length}
        </div>

        <p>
            ${percentage}%
        </p>

        <p>
            ${message}
        </p>

        <button onclick="location.reload()">
            Take Quiz Again
        </button>

    `;
}

</script>

</html>
