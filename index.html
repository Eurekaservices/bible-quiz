
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Knowledge Challenge</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f1f4f8;
    color: #202b3c;
}

.container {
    max-width: 760px;
    margin: 35px auto;
    background: #fff;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1, h2 { text-align: center; }

h1 { color: #183b65; }

.subtitle {
    text-align: center;
    color: #64748b;
    line-height: 1.6;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    margin: 15px 0;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 13px 18px;
    font-size: 15px;
    cursor: pointer;
}

.primary {
    background: #183b65;
    color: white;
    width: 100%;
    font-weight: bold;
}

.primary:hover { background: #102b4b; }

.hidden { display: none; }

.progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #64748b;
    margin-bottom: 10px;
}

.progress-bar {
    width: 100%;
    height: 9px;
    background: #e2e8f0;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #2563eb;
    transition: width .3s;
}

.category {
    display: inline-block;
    background: #e8eef8;
    color: #183b65;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 12px;
}

.question {
    font-size: 20px;
    line-height: 1.6;
    margin: 12px 0 22px;
}

.option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 15px;
    margin: 10px 0;
    background: #f8fafc;
    border: 1px solid #dbe2ea;
    color: #202b3c;
    border-radius: 8px;
    font-size: 15px;
}

.option:hover:not(:disabled) {
    background: #edf3fb;
    border-color: #7b9bc4;
}

.option:disabled { cursor: default; }

.option.correct {
    background: #dcfce7;
    border-color: #16a34a;
    color: #166534;
}

.option.wrong {
    background: #fee2e2;
    border-color: #dc2626;
    color: #991b1b;
}

.feedback {
    margin-top: 18px;
    padding: 14px;
    border-radius: 8px;
    line-height: 1.5;
    display: none;
}

.feedback.correct-feedback {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.feedback.wrong-feedback {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.next-btn {
    margin-top: 20px;
    background: #183b65;
    color: white;
    width: 100%;
    display: none;
}

.score-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: #e8eef8;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 25px auto;
    font-size: 30px;
    font-weight: bold;
    color: #183b65;
}

.result-text {
    text-align: center;
    line-height: 1.7;
}

.result-stats {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 20px 0;
    text-align: center;
}

.stat-number {
    display: block;
    font-size: 24px;
    font-weight: bold;
    color: #183b65;
}

.answer-key {
    margin-top: 25px;
    border-top: 1px solid #e2e8f0;
    padding-top: 20px;
}

.answer-key-item {
    padding: 12px 0;
    border-bottom: 1px solid #e2e8f0;
    line-height: 1.5;
}

.answer-key-item strong { color: #183b65; }

.toggle-btn {
    background: #e8eef8;
    color: #183b65;
    width: 100%;
    margin-top: 20px;
    font-weight: bold;
}

@media(max-width: 600px) {
    body { padding: 10px; }
    .container { padding: 20px; margin: 15px auto; }
    .question { font-size: 18px; }
    .result-stats { gap: 15px; }
}
</style>
</head>

<body>

<div class="container">

    <section id="startScreen">
        <h1>Bible Knowledge Challenge</h1>
        <p class="subtitle">
            50 questions. Multiple clues. One correct answer.
            Test your understanding of Scripture and see how well
            you can identify the books behind the events and teachings.
        </p>

        <input type="text" id="playerName" placeholder="Enter your name">

        <button class="primary" onclick="startQuiz()">Start Challenge</button>
    </section>

    <section id="quizScreen" class="hidden">

        <div class="progress-info">
            <span id="questionCount"></span>
            <span id="scoreDisplay">Score: 0</span>
        </div>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <span class="category" id="category"></span>

        <div class="question" id="questionText"></div>

        <div id="options"></div>

        <div class="feedback" id="feedback"></div>

        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
            Next Question
        </button>

    </section>

    <section id="resultScreen" class="hidden">

        <h1>Challenge Completed!</h1>

        <p class="result-text" id="greeting"></p>

        <div class="score-circle" id="finalScore"></div>

        <div class="result-stats">
            <div>
                <span class="stat-number" id="correctCount">0</span>
                Correct
            </div>
            <div>
                <span class="stat-number" id="wrongCount">0</span>
                Incorrect
            </div>
        </div>

        <p class="result-text" id="performanceMessage"></p>

        <button class="toggle-btn" onclick="toggleAnswerKey()" id="answerKeyBtn">
            View Organiser's Answer Key
        </button>

        <div class="answer-key hidden" id="answerKey"></div>

        <button class="primary" style="margin-top:25px" onclick="restartQuiz()">
            Try Again
        </button>

    </section>

</div>

let currentQuestion = 0;
let score = 0;
let player = "";
let answered = false;

function showScreen(screenId) {
    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("quizScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.add("hidden");
    document.getElementById(screenId).classList.remove("hidden");
}

function startQuiz() {
    const nameInput = document.getElementById("playerName").value.trim();

    if (!nameInput) {
        alert("Please enter your name before starting.");
        return;
    }

    player = nameInput;
    currentQuestion = 0;
    score = 0;

    showScreen("quizScreen");
    renderQuestion();
}

function renderQuestion() {
    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("questionCount").textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;

    document.getElementById("scoreDisplay").textContent =
        `Score: ${score}`;

    document.getElementById("progress").style.width =
        `${(currentQuestion / questions.length) * 100}%`;

    document.getElementById("category").textContent = q.category;
    document.getElementById("questionText").textContent = q.question;

    const optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";

    q.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.className = "option";
        button.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
        button.onclick = () => answerQuestion(index);
        optionsContainer.appendChild(button);
    });

    const feedback = document.getElementById("feedback");
    feedback.className = "feedback";
    feedback.style.display = "none";
    feedback.textContent = "";

    document.getElementById("nextBtn").style.display = "none";
}

function answerQuestion(selectedIndex) {
    if (answered) return;

    answered = true;

    const q = questions[currentQuestion];
    const buttons = document.querySelectorAll(".option");
    const feedback = document.getElementById("feedback");

    buttons.forEach((button, index) => {
        button.disabled = true;

        if (index === q.correct) {
            button.classList.add("correct");
        }

        if (index === selectedIndex && selectedIndex !== q.correct) {
            button.classList.add("wrong");
        }
    });

    if (selectedIndex === q.correct) {
        score++;
        feedback.className = "feedback correct-feedback";
        feedback.textContent =
            `Correct! The answer is ${q.options[q.correct]}.`;
    } else {
        feedback.className = "feedback wrong-feedback";
        feedback.textContent =
            `Not quite. The correct answer is ${q.options[q.correct]}.`;
    }

    feedback.style.display = "block";

    document.getElementById("scoreDisplay").textContent =
        `Score: ${score}`;

    document.getElementById("nextBtn").style.display = "block";

    document.getElementById("nextBtn").textContent =
        currentQuestion === questions.length - 1
        ? "View Results"
        : "Next Question";
}

function nextQuestion() {
    currentQuestion++;

    if (currentQuestion < questions.length) {
        renderQuestion();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {
    showScreen("resultScreen");

    const percentage = Math.round((score / questions.length) * 100);
    const wrong = questions.length - score;

    document.getElementById("progress").style.width = "100%";

    document.getElementById("greeting").textContent =
        `Well done, ${player}. You have completed the Bible Knowledge Challenge.`;

    document.getElementById("finalScore").textContent =
        `${percentage}%`;

    document.getElementById("correctCount").textContent = score;
    document.getElementById("wrongCount").textContent = wrong;

    let message = "";

    if (percentage >= 90) {
        message = "Outstanding! You demonstrated excellent knowledge and understanding of Scripture.";
    } else if (percentage >= 75) {
        message = "Very good performance! You have a strong understanding of biblical accounts and teachings.";
    } else if (percentage >= 60) {
        message = "Good effort! Keep studying and connecting the details in Scripture.";
    } else if (percentage >= 40) {
        message = "You are making progress. Spend more time reading and understanding the biblical passages.";
    } else {
        message = "There is room to improve. Keep studying Scripture, and do not be discouraged.";
    }

    document.getElementById("performanceMessage").textContent = message;

    buildAnswerKey();
}

function buildAnswerKey() {
    const container = document.getElementById("answerKey");
    container.innerHTML = "<h2>Organiser's Answer Key</h2>";

    questions.forEach((q, index) => {
        const item = document.createElement("div");
        item.className = "answer-key-item";

        const title = document.createElement("strong");
        title.textContent =
            `Question ${index + 1}: ${q.options[q.correct]}`;

        const reference = document.createElement("div");
        reference.textContent = `Scripture: ${q.reference}`;

        item.appendChild(title);
        item.appendChild(reference);
        container.appendChild(item);
    });
}

function toggleAnswerKey() {
    const key = document.getElementById("answerKey");
    const button = document.getElementById("answerKeyBtn");

    key.classList.toggle("hidden");

    button.textContent = key.classList.contains("hidden")
        ? "View Organiser's Answer Key"
        : "Hide Organiser's Answer Key";
}

function restartQuiz() {
    document.getElementById("playerName").value = "";
    document.getElementById("answerKey").classList.add("hidden");

    document.getElementById("answerKeyBtn").textContent =
        "View Organiser's Answer Key";

    showScreen("startScreen");
}
</script>

</body>
</html>
